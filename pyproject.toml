[project]
name = "irs-research-mcp"
version = "0.1.0"
description = "IRS Research MCP Server — form taxonomy, revision history, and data-flow graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pymupdf>=1.24.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.scripts]
# Run the MCP server
irs-research-mcp = "irs_research_server.app:main"
# Offline catalog maintenance scripts
irs-scrape = "scripts.scrape_catalog:main"
irs-build-catalog = "scripts.build_catalog:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irs_research_server"]

[dependency-groups]
# Dev-only deps. Install with `uv sync --group dev`.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv"]
# Don't reformat Python code fences inside Markdown docs (they're illustrative
# snippets, not runnable modules).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
